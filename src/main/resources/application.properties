spring.application.name=foodCourt

server.port=8081

# Feign Client Configuration
feign.user-service.url=http://localhost:8080
feign.messaging-service.url=http://localhost:8082
feign.traceability-service.url=http://localhost:8083

spring.datasource.url=jdbc:mysql://localhost:3306/plazoleta
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Documentacion
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.enabled=true

# Configuracion de mensajes
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Spring Security
application.security.jwt.secret-
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token=604800000